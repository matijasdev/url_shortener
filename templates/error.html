<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Error</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    background: #0b1020;
    color: #e5e7eb;
    font-family: Inter, sans-serif;
}

.box {
    padding: 40px;
    border-radius: 16px;

    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    backdrop-filter: blur(16px);

    text-align: center;
    max-width: 500px;
}

h1 {
    font-size: 1.8rem;
    margin-bottom: 12px;
}

p {
    color: #9ca3af;
    margin-bottom: 20px;
}

a {
    color: #7dd3fc;
    text-decoration: none;
}

a:hover {
    text-decoration: underline;
}
</style>
</head>

<body>

<div class="box">
    <h1>Code not found</h1>
    <p>This short code does not exist or has expired.</p>
    <a href="/">Go home</a>
</div>

</body>
</html>
